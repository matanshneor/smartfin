# נעילת תלויות טרנזיטיביות — נוצר מ-requirements.txt.
#
# requirements.txt מקבע את מה שאנחנו בוחרים במפורש (Flask, supabase,
# gunicorn…). כל השאר — postgrest, gotrue, storage3, realtime, pydantic,
# httpcore — נפתר מחדש בכל בנייה, כלומר גרסה חדשה של תלות שאנחנו בכלל
# לא מכירים נכנסת לפרודקשן בלי שאף אחד יאשר אותה. זה גם מקור לשבירות
# אקראיות וגם משטח supply-chain.
#
# כדי לרענן אחרי שינוי ב-requirements.txt:
#   python3 -m venv /tmp/lockenv && /tmp/lockenv/bin/pip install -r requirements.txt
#   /tmp/lockenv/bin/pip freeze > requirements.lock
#
# הפריסה משתמשת ב-requirements.txt (ראו Procfile/Railway); הקובץ הזה הוא
# התיעוד של מה שנפתר בפועל, ומה ש-pip-audit ב-CI סורק.
