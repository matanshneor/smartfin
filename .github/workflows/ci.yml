# בדיקות לפני פריסה.
#
# הצורך אמיתי ומיידי: דחיפה ל-main מפעילה דיפלוי אוטומטי ב-Railway, כך
# שקוד שובר עולה לאוויר בלי שום עצירה בדרך. עד היום זה עבד כי אדם אחד
# נוגע בקוד ומריץ בדיקות ידנית; מרגע שיש משתמשים אמיתיים זו רשת ביטחון
# שחייבת להיות אוטומטית.
#
# רצות רק בדיקות היחידה (-m unit). הן לא נוגעות ב-Supabase, ולכן אין
# צורך בשום סוד ב-GitHub — וזו החלטה ולא ויתור: מפתחות פרודקשן ב-CI הם
# משטח תקיפה חדש, ובדיקות שמדברות עם המסד האמיתי היו גם משנות אותו.
# בדיקות האינטגרציה ממשיכות לרוץ מקומית מול הפרויקט המקושר.

name: בדיקות

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: גרסת פייתון מ-runtime.txt
        # setup-python קורא את הקובץ אבל לא מסיר את הקידומת "python-" של
        # פורמט Heroku, ש-Railway משתמש בו. גוזרים אותה כאן כדי שגרסת
        # ה-CI וגרסת הפרודקשן יישארו מקור אמת אחד.
        id: py
        run: echo "version=$(sed 's/^python-//' runtime.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.version }}
          cache: pip

      - name: התקנת תלויות
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt   # כולל -r requirements.txt

      - name: בדיקות יחידה
        # ערך דמה: האפליקציה מסרבת לעלות בלי SECRET_KEY, וזו הגנה מכוונת.
        # אין לו שום קשר למפתח האמיתי שב-Railway.
        env:
          SECRET_KEY: ci-only-not-a-real-secret
        # ‎--cov-fail-under‎ הוא רצפה, לא יעד ולא ציון: מתחת למצב הנוכחי,
        # רק כדי שכיסוי לא ייעלם בשקט. זה בדיוק מה שקרה למסלולי הכסף —
        # הוספה, עריכה, מחיקה ואיפוס לא נבדקו כלל בזמן ש-524 בדיקות רצו
        # ירוקות. העלאת המספר היא החלטה מודעת, לא תופעת לוואי של רפקטור.
        run: python -m pytest tests/ -m unit -q --cov=backend --cov-report=term --cov-fail-under=55

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: גרסת פייתון מ-runtime.txt
        # setup-python קורא את הקובץ אבל לא מסיר את הקידומת "python-" של
        # פורמט Heroku, ש-Railway משתמש בו. גוזרים אותה כאן כדי שגרסת
        # ה-CI וגרסת הפרודקשן יישארו מקור אמת אחד.
        id: py
        run: echo "version=$(sed 's/^python-//' runtime.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.version }}

      - name: סריקת פרצות ידועות בתלויות
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --progress-spinner off
          # וגם הנעילה: ‎requirements.txt‎ מקבע רק את מה שנבחר במפורש,
          # וכל השאר (postgrest, gotrue, pydantic, httpcore…) נפתר מחדש
          # בכל בנייה. סריקה של הישיר בלבד מפספסת בדיוק את החלק שאף אחד
          # לא אישר.
          pip-audit -r requirements.lock --progress-spinner off
