<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#141007">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SmartFin">
    <meta name="description" content="SmartFin – ניהול תקציב משפחתי חכם: מעקב הוצאות, הכנסות וחיסכון">
    <title>SmartFin – איפוס סיסמה</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-180.png') }}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">

    <div class="auth-container">
        <a class="auth-back" href="{{ url_for('dashboard') }}">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            חזרה
        </a>

        <div class="auth-hero">
            <div class="auth-logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
                    <path d="M5 21L12.5 13.5L17.5 18.5L27 9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M20 9H27V16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1 class="auth-app-name">SmartFin</h1>
            <p class="auth-tagline">קביעת סיסמה חדשה</p>
        </div>

        <div class="auth-form-card">
            <h2 class="auth-form-title">סיסמה חדשה</h2>

            <div class="alert alert-error" id="tokenError" style="display:none;">
                קישור האיפוס לא תקין או שפג תוקפו.
                <a href="{{ url_for('login') }}" class="auth-link">חזרה להתחברות</a>
            </div>

            <form class="auth-form" id="resetForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="newPassword">סיסמה חדשה (לפחות 6 תווים)</label>
                    <input class="form-input" type="password" id="newPassword"
                           placeholder="••••••••" required autocomplete="new-password" minlength="6">
                </div>

                <div class="form-group">
                    <label class="form-label" for="passwordConfirm">אימות סיסמה</label>
                    <input class="form-input" type="password" id="passwordConfirm"
                           placeholder="••••••••" required autocomplete="new-password" minlength="6">
                </div>

                <p class="form-error" id="resetError" role="alert"></p>

                <button type="submit" class="submit-btn" id="resetBtn">עדכן סיסמה</button>
            </form>
        </div>
    </div>

<script src="{{ url_for('static', filename='js/reset-password.js') }}"></script>

</body>
</html>
